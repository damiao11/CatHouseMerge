  order-strip -> 横向猫咪订单区

  action-bar -> 底部固定操作区
  app-overlays -> 轻提示

      <h1>把旧屋，慢慢变成家。</h1>
      <p class="preview-intro">保留你喜欢的明快配色与圆润组件。<br>先在这里试一试，再决定安卓实现。</p>

            class="flex h-[92px] w-[220px] flex-col justify-center rounded-[16px] border-[2.5px] border-[#A96B36] border-b-[4px] bg-[#FFF8DF] px-[11px] shadow-[0_2px_0_rgba(169,107,54,0.16)]"

              id="tip-title"

            <p
              id="tip-sub"
              class="mt-[3px] text-[11.5px] leading-[16px] text-[#8A6A48]"

              拖动相同物品进行合成

            <span
              class="mt-[3px] h-[3px] w-[34px] rounded-full bg-[#F6B63F]"
            ></span>
          </div>

          <!-- 仓库 -->
          <button
            type="button"
            data-action="storage" aria-label="仓库，第4天开放"
            class="flex h-[92px] w-[48px] flex-col items-center justify-center gap-[3px] rounded-[16px] border-[2.5px] border-[#A96B36] border-b-[4px] bg-[#FFF8DF] shadow-[0_2px_0_rgba(169,107,54,0.16)] active:translate-y-[1px]"
          >
            <span class="relative block">
              <svg
                viewBox="0 0 24 24"
                class="h-[23px] w-[23px]"
                fill="none"
                stroke="#624125"
                stroke-width="2.1"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M4.2 8.4h15.6V19a2 2 0 0 1-2 2H6.2a2 2 0 0 1-2-2z" />
                <path d="M4.2 8.4 6.6 3.6h10.8l2.4 4.8" />
                <path d="M12 8.4V21" />
                <path d="M8.6 13.4h1.8M13.6 13.4h1.8" />
              </svg>
              <span
                class="absolute -right-[8px] -top-[3px] flex h-[13px] w-[13px] items-center justify-center rounded-full border-[1.5px] border-[#A96B36] bg-[#F6B63F]"
              >
                <svg
                  viewBox="0 0 24 24"
                  class="h-[8px] w-[8px]"
                  fill="none"
                  stroke="#7A4A1E"
                  stroke-width="3.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect
                    x="4"
                    y="10.5"
                    width="16"
                    height="10.5"
                    rx="2.6"
                    fill="#FFE3A9"
                  />
                  <path d="M7.6 10.5V7.8a4.4 4.4 0 0 1 8.8 0v2.7" />
                </svg>
              </span>
            </span>
            <span class="text-[11.5px] font-black leading-none text-[#624125]"
              >仓库</span
            >
            <span
              class="rounded-full bg-[#FFEFC7] px-[3px] text-[8px] font-bold leading-[11px] text-[#A96B36]"
              >第4天开放</span
            >
          </button>
        </div>
        <!-- qb:section:action-bar:end -->

        <!-- qb:section:app-overlays:start -->
        <div
          id="app-overlays"
          data-qb-section="app-overlays"
          class="pointer-events-none absolute inset-0 z-40 flex flex-col items-center justify-end gap-[6px] pb-[116px]"
          aria-live="polite"
        ></div>
        <!-- qb:section:app-overlays:end -->

        <!-- 类名守卫：保证动态使用的工具类已生成 -->
        <div
          class="hidden -translate-y-1 scale-110 z-30 opacity-0 opacity-100"
        ></div>
      </div>
    </div>
